# BaFuse Configuration File

# Data Paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"

# Data Processing
processing:
  time_tolerance_hours: 24
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  random_state: 42
  stratify_by_soh: true

# Model Architecture
model:
  discharge_input_size: 3   # [voltage_v, current_a, temperature_c]
  eis_num_frequencies: 3    # [impedance, Re, Rct]
  physics_num_features: 4   # [cycle_age_norm, empirical_fade_prior, voltage_droop, impedance_rise]
  latent_dim: 64
  fusion_method: "cross_attention"
  fusion_dim: 128
  physics_encoder_type: "mlp"   # Task 3: "mlp" | "cnn1d"

# Encoders
encoders:
  discharge:
    type: "lstm"
    hidden_size: 256        # P4: increased from 128
    num_layers: 3           # P4: increased from 2
    dropout: 0.2
  eis:
    type: "mlp"
    hidden_size: 128
    dropout: 0.2
  physics:
    type: "mlp"
    hidden_sizes: [256, 128]
    dropout: 0.2

# Fusion
fusion:
  cross_attention:
    num_heads: 4
    dropout: 0.1

# Loss Functions
loss:
  base_loss: "mse"
  lambda_physics: 0.1
  lambda_smooth: 0.05
  lambda_diversity: 0.01

# Training
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.0005     # P4: reduced from 0.001
  weight_decay: 1e-5
  optimizer: "adam"
  scheduler:
    type: "cosine"
    warmup_epochs: 10       # P4: increased from 5
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001
  num_workers: 4
  pin_memory: true
  shuffle: true

# Evaluation
evaluation:
  metrics: ["mae", "rmse", "r2", "mape"]
  per_battery_analysis: true
  uncertainty_quantification:
    enabled: true
    mc_samples: 30

# Ablation Study
ablation:
  run: true
  modalities: ["discharge", "eis", "physics"]
  pairwise: true

# Output
output:
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  dashboard_port: 8501

# Hardware
device: "cuda"
deterministic: true
seed: 42
